<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Mentor.ia - Criar Conta</title>
<!-- Tailwind CSS CDN com plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuração de Cores & Fontes -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#1E3A8A'
            },
            inputBg: '#EFEFEF',
            neutralDark: '#1E293B',
            neutralMuted: '#64748B'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="ios-native-tweaks">
    /* Otimização de toque e renderização iOS */
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    input::placeholder {
      color: #94A3B8;
      font-size: 0.95rem;
    }
    /* Suporte a notch e safe-area */
    .safe-top {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 font-sans">
<!-- BEGIN: MainContainer -->
<!-- Contêiner simulando dispositivo Mobile iOS -->
<main class="w-full max-w-[420px] min-h-screen sm:min-h-[850px] bg-white sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col justify-between safe-top safe-bottom relative border border-slate-100">
<!-- BEGIN: TopNavigation -->
<header class="px-6 pt-4 pb-2 flex items-center justify-between" data-purpose="screen-header">
<!-- Botão Voltar -->
<button aria-label="Voltar para a tela anterior" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100 active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Indicador de Passo / Marca D'água sutil -->
<div class="text-xs font-semibold tracking-wider text-slate-400 uppercase bg-slate-50 px-3 py-1 rounded-full border border-slate-100">
        Passo 02 de 02
      </div>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: ContentArea -->
<section class="flex-1 px-7 pt-2 pb-6 flex flex-col justify-start" data-purpose="registration-form-section">
<!-- Cabeçalho de Boas-Vindas -->
<div class="mb-6">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-brand-50 text-brand-700 text-xs font-semibold tracking-wide mb-2">
<span>✨ Mentor.ia</span>
</div>
<h1 class="text-2xl sm:text-3xl font-bold text-brand-900 tracking-tight leading-snug">
          Crie sua conta !
        </h1>
<p class="text-xs sm:text-sm text-neutralMuted mt-1 leading-relaxed">
          Comece a estudar de forma personalizada e inteligente com apoio de IA.
        </p>
</div>
<!-- Formulário de Cadastro -->
<form class="space-y-3.5" id="signup-form" onsubmit="event.preventDefault();">
<!-- Campo: Nome Completo -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1 ml-1" for="name">Nome completo</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-2xl bg-[#EBECEF] border-none text-slate-800 text-sm focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all shadow-inner" id="name" name="name" placeholder="Seu nome completo" required="" type="text">
</div>
</div>
<!-- Campo: E-mail -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1 ml-1" for="email">E-mail</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-2xl bg-[#EBECEF] border-none text-slate-800 text-sm focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all shadow-inner" id="email" name="email" placeholder="exemplo@estudo.com" required="" type="email">
</div>
</div>
<!-- Campo: Meta de Estudo / Curso -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1 ml-1" for="goal">Foco ou meta de estudo</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-2xl bg-[#EBECEF] border-none text-slate-800 text-sm focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all shadow-inner" id="goal" name="goal" placeholder="Ex: Medicina, ENEM ou Concursos" type="text">
</div>
</div>
<!-- Campo: Senha -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1 ml-1" for="password">Senha</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-2xl bg-[#EBECEF] border-none text-slate-800 text-sm focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all shadow-inner pr-11" id="password" minlength="6" name="password" placeholder="Mínimo 6 caracteres" required="" type="password">
<button aria-label="Alternar visibilidade de senha" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" id="toggle-password" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
<!-- Indicador visual sutil de força da senha -->
<div class="flex items-center gap-1.5 mt-2 px-1" data-purpose="password-strength-indicator">
<div class="h-1 flex-1 rounded-full bg-emerald-500 transition-colors"></div>
<div class="h-1 flex-1 rounded-full bg-emerald-500 transition-colors"></div>
<div class="h-1 flex-1 rounded-full bg-slate-200 transition-colors"></div>
<span class="text-[10px] text-emerald-600 font-medium ml-1">Segura</span>
</div>
</div>
<!-- Campo: Confirmar Senha -->
<div>
<label class="block text-xs font-semibold text-slate-700 mb-1 ml-1" for="confirm-password">Confirmar senha</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-2xl bg-[#EBECEF] border-none text-slate-800 text-sm focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all shadow-inner" id="confirm-password" name="confirm-password" placeholder="Repita sua senha" required="" type="password">
</div>
</div>
<!-- Termos de Uso e Política de Privacidade -->
<div class="pt-1">
<label class="flex items-start gap-2.5 cursor-pointer">
<input class="w-4 h-4 mt-0.5 rounded text-brand-700 focus:ring-brand-500 border-slate-300 transition-colors cursor-pointer" required="" type="checkbox">
<span class="text-[11px] leading-tight text-slate-500">
              Concordo com os <a class="text-brand-700 font-semibold underline underline-offset-2 hover:text-brand-800" href="#">Termos de Uso</a> e <a class="text-brand-700 font-semibold underline underline-offset-2 hover:text-brand-800" href="#">Política de Privacidade</a> do Mentor.ia.
            </span>
</label>
</div>
<!-- Botão de Ação Primário -->
<div class="pt-2">
<button class="w-full h-12 sm:h-13 bg-[#2b52b5] hover:bg-brand-800 active:bg-brand-900 active:scale-[0.99] text-white font-semibold text-base rounded-2xl shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2 transition-all duration-150" type="submit">
<span>Criar conta</span>
</button>
</div>
</form>
<!-- Fim do Formulário -->
</section>
<!-- END: ContentArea -->
<!-- BEGIN: Footer -->
<footer class="px-7 pb-6 pt-2 text-center" data-purpose="auth-switch-footer">
<p class="text-xs sm:text-sm text-slate-500">
        Já possui uma conta? 
        <a class="text-[#2b52b5] font-semibold underline underline-offset-2 hover:text-brand-800 transition-colors ml-1" href="#">
          Fazer login
        </a>
</p>
</footer>
<!-- END: Footer -->
</main>
<!-- END: MainContainer -->
<!-- Script simples para toggle de visibilidade de senha -->
<script data-purpose="form-interactivity">
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
      });
    }
  </script>
</body></html>
