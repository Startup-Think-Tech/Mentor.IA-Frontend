<!-- Row 2: Weekdays & Weekend (QUI, SEX, SAB) -->

<!-- BEGIN: Interactive Logic for Day Toggle -->
<script data-purpose="day-selection-toggle">
    // Add lightweight interaction so user can toggle chips naturally
    document.addEventListener('DOMContentLoaded', () => {
      const pills = document.querySelectorAll('.interactive-pill');
      
      pills.forEach((pill) => {
        pill.addEventListener('click', () => {
          const isSelected = pill.classList.contains('bg-brand-600');
          if (isSelected) {
            pill.classList.remove('bg-brand-600', 'hover:bg-brand-700', 'text-white', 'shadow-sm');
            pill.classList.add('bg-slate-100', 'hover:bg-slate-200', 'text-slate-600');
          } else {
            pill.classList.remove('bg-slate-100', 'hover:bg-slate-200', 'text-slate-600');
            pill.classList.add('bg-brand-600', 'hover:bg-brand-700', 'text-white', 'shadow-sm');
          }
        });
      });
    });
  </script>
<!-- END: Interactive Logic -->
</body></html>
