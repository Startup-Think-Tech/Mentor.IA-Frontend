services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_ENEM_API_URL: https://api.enem.dev/v1
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - mentor_ia_app_node_modules:/app/node_modules

volumes:
  mentor_ia_app_node_modules:
